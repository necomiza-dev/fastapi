<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить фильм</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Добавить новый фильм</h1>
        <form action="/add_movie" method="post" enctype="multipart/form-data">
            <label for="name">Название (RU):</label>
            <input type="text" id="name" name="name" required>

            <label for="name_en">Название (EN):</label>
            <input type="text" id="name_en" name="name_en" required>

            <label for="director">Режиссёр:</label>
            <input type="text" id="director" name="director" required>

            <label for="cost">Бюджет (USD):</label>
            <input type="number" id="cost" name="cost" required>

            <label for="year">Год выпуска:</label>
            <input type="number" id="year" name="year" min="1900" max="2025" required>

            <label for="is_classic">Это классика?</label>
            <input type="checkbox" id="is_classic" name="is_classic_str" value="true">

            <label for="description_file">Файл описания (txt):</label>
            <input type="file" id="description_file" name="description_file" accept=".txt">

            <label for="cover_file">Обложка фильма (изображение):</label>
            <input type="file" id="cover_file" name="cover_file" accept="image/*">

            <button type="submit">Добавить фильм</button>
        </form>
        <a href="/movietop">Назад к списку</a>
    </div>
</body>
</html>
